# Локальная PostgreSQL QwenDirector. Данные сохраняются в именованном volume.
services:
  postgres:
    image: postgres:18
    pull_policy: never
    profiles: [dev]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qwendirector}
      POSTGRES_USER: ${POSTGRES_USER:-qwendirector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - qwendirector_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"
volumes:
  qwendirector_pgdata:
